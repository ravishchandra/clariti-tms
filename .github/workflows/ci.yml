name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app cli --ignore-missing-imports
      # Fail if the committed OpenAPI spec is stale vs. the live app. Keeps the
      # SDK/web-client contract from silently drifting (developer-packet §19/§20).
      - name: OpenAPI spec is current
        run: python scripts/dump_openapi.py --check
        env:
          DEBUG: "true"

  web-client:
    name: Web client up to date
    runs-on: ubuntu-latest
    # The generated, Zod-validating web API client (web/src/client/) must match
    # the live OpenAPI spec. Regenerate spec + client and fail on any diff — the
    # frontend half of the §19/§20 drift guard (Phase 3). If this fails: run
    # `python scripts/dump_openapi.py && (cd web && pnpm gen:client)` and commit.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - name: Regenerate spec + client
        run: |
          python scripts/dump_openapi.py
          pnpm --dir web gen:client
        env:
          DEBUG: "true"
      - name: Fail if spec or client drifted
        run: git diff --exit-code -- sdk-gen/openapi.json web/src/client

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: clariti
          POSTGRES_PASSWORD: clariti
          POSTGRES_DB: clariti_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clariti"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://clariti:clariti@localhost:5432/clariti_test
      # DEBUG=true relaxes the SECRET_KEY/FERNET_KEY length-and-presence checks
      # so the test runner doesn't need real production-grade keys.
      DEBUG: "true"
      ANTHROPIC_API_KEY: ""
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Generate ephemeral CI keys
        # Both keys are required when DEBUG=False; we keep DEBUG=true above to
        # avoid that path, but tests that explicitly flip DEBUG=False (see
        # tests/core/test_settings.py) need real-shape values in env.
        run: |
          {
            echo "SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
            echo "FERNET_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          } >> "$GITHUB_ENV"
      - name: Run migrations
        run: |
          cd infra
          alembic upgrade head
      - run: pytest -x -q
