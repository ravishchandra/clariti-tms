name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# Prevent concurrent runs from racing on the signatures file.
concurrency:
  group: cla-${{ github.actor }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA signature check
    runs-on: ubuntu-latest
    # Trigger on PR events or on the explicit "I have read the CLA" comment.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA')) ||
      github.event_name == 'pull_request_target'
    steps:
      - name: CLA check
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PERSONAL_ACCESS_TOKEN is required if the signatures repo lives in a
          # separate repository from the project. Leave unset to store
          # signatures inside this same repo at `signatures/cla.json`.
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/${{ github.repository }}/blob/main/CLA.md'
          branch: 'main'
          allowlist: dependabot[bot]
          # Maintainer accounts that should be exempt — add yourself here so
          # the bot does not block your own PRs. Add comma-separated logins.
          # bot-name: cla-bot[bot]
          custom-notsigned-prcomment: |
            Thank you for your contribution! Before we can merge, we need every
            contributor to sign the [Contributor License Agreement](https://github.com/${{ github.repository }}/blob/main/CLA.md).
            This is a one-time agreement that lets us dual-license the project
            (AGPL + commercial) — see CLA.md for the full rationale.
          custom-pr-sign-comment: |
            I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: |
            All Contributors have signed the CLA. ✓
