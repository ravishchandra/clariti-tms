[project]
name = "clariti-tms"
version = "0.1.0"
description = "Self-hosted translation management system"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{ name = "ClaritiTMS contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Internationalization",
    "Topic :: Software Development :: Localization",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "anthropic>=0.40",
    "openai>=1.57",
    "httpx>=0.28",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "typer>=0.13",
    "rich>=13.9",
    "python-multipart>=0.0.18",
    "cryptography>=44",
    "pyjwt[crypto]>=2.10",
    "apscheduler>=3.11",
    "mcp>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx>=0.28",
]

[project.scripts]
loc = "cli.main:app"
clariti-mcp = "app.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "cli"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
# Strict mode was failing on 142 pre-existing `dict`-without-type-args
# annotations and unused-ignore comments. The codebase is typed but not
# fully strict-clean; this profile catches the high-value bugs (None
# handling, untyped function bodies, redundant casts) without forcing an
# all-or-nothing cleanup. Ratchet individual flags back to `true` as
# modules get cleaned.
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app", "cli", "tests"]
